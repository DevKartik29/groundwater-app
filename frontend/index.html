<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groundwater Command Center</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Immersive Map Background -->
    <div id="map"></div>

    <!-- HUD Overlay -->
    <div class="hud-container">
        
        <!-- Top Nav HUD -->
        <header class="hud-panel nav-top">
            <div class="nav-brand">💧 GW COMMAND CENTER</div>
            <div style="font-size: 0.85rem; font-weight: 600; letter-spacing: 0.05em;" id="header-status">
                STATUS: ANALYZING NETWORK...
            </div>
        </header>

        <!-- Left Drawer HUD -->
        <aside class="hud-panel left-drawer">
            <div class="hud-section">
                <div class="text-label">NETWORK INTELLIGENCE</div>
                <p class="text-muted" style="font-size: 0.85rem; margin-top: 0.5rem;">Track multi-year trends and sensor anomalies across the national monitoring network.</p>
            </div>

            <div class="hud-section">
                <div class="text-label" style="margin-bottom: 1rem;">NETWORK STATUS</div>
                <div class="donut-wrapper">
                    <canvas id="status-donut"></canvas>
                </div>
                <div class="legend-list">
                    <div class="legend-item"><span class="dot bg-red"></span> <strong id="donut-declining" class="text-bright">-</strong> <span class="text-muted">Declining</span></div>
                    <div class="legend-item"><span class="dot bg-amber"></span> <strong id="donut-stable" class="text-bright">-</strong> <span class="text-muted">Stable</span></div>
                    <div class="legend-item"><span class="dot bg-green"></span> <strong id="donut-recovering" class="text-bright">-</strong> <span class="text-muted">Recovering</span></div>
                </div>
            </div>

            <div class="hud-section" style="background: rgba(255,255,255,0.02);">
                <div class="text-label" style="margin-bottom: 0.5rem;">SUMMARY</div>
                <p id="interpretation-text" style="font-size: 0.9rem;">Loading intelligence...</p>
            </div>

            <div class="hud-section" style="flex: 1; border-bottom: none;">
                <div class="text-label">CRITICAL HIGHLIGHTS</div>
                <div id="highlights-container" style="margin-top: 0.5rem;">
                    <p class="text-muted" style="font-size: 0.85rem;">Analyzing signals...</p>
                </div>
            </div>
        </aside>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="shared.js"></script>
    <script src="map.js"></script>
</body>
</html>
